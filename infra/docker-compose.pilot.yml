# Docker Compose — PILOT-окружение
# Использование (локально):
#   bash infra/ssl/generate-self-signed.sh pilot
#   docker compose -f infra/docker-compose.pilot.yml --env-file .env.pilot up -d
#
# На сервере отличается только:
#   - TLS-сертификат (Let's Encrypt вместо self-signed)
#   - .env.pilot создаётся CI из GitHub Secrets
#
# Принципы:
#   - снаружи открыт только nginx (80/443)
#   - все сервисы перезапускаются автоматически (unless-stopped)
#   - ротация логов через json-file driver
#   - отдельная сеть и volume от dev/test

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ─── Инфраструктура ────────────────────────────────────────

  postgres:
    image: postgres:16-alpine
    container_name: tz-pilot-postgres
    restart: unless-stopped
    env_file: ../.env.pilot
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Для локального seed/migrations с хоста (только 127.0.0.1; 5432 часто занят на Windows)
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata-pilot:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *default-logging
    networks:
      - teamzachet-pilot

  # ─── Приложение ────────────────────────────────────────────

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: teamzachet-backend:pilot
    container_name: tz-pilot-backend
    restart: unless-stopped
    env_file: ../.env.pilot
    environment:
      BACKEND_DEBUG: "false"
    # Порты НЕ открыты наружу
    volumes:
      - uploads-pilot:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - teamzachet-pilot

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE: /api
        VITE_USE_MOCK: "false"
    image: teamzachet-frontend:pilot
    container_name: tz-pilot-frontend
    restart: unless-stopped
    # Порты НЕ открыты наружу
    depends_on:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "nginx -t"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - teamzachet-pilot

  # ─── Reverse Proxy (единственная точка входа) ──────────────

  nginx:
    image: nginx:1.25-alpine
    container_name: tz-pilot-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.pilot.conf:/etc/nginx/conf.d/default.conf:ro
      - ./ssl/certbot-webroot:/var/www/certbot:ro
      - ./ssl/certs:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --no-check-certificate --header='Host: teamzachet.ru' https://127.0.0.1/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    logging: *default-logging
    networks:
      - teamzachet-pilot

volumes:
  pgdata-pilot:
  uploads-pilot:

networks:
  teamzachet-pilot:
    driver: bridge
